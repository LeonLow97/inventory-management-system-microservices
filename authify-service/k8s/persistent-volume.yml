apiVersion: v1
kind: PersistentVolume
metadata:
  name: authify-pv-user
spec:
  accessModes:
    - ReadWriteOnce
  capacity:
    storage: 500Mi
  # manually creating PV to match the StorageClass, ensures that this PV is considered for
  # PVCs that request this StorageClass
  storageClassName: authify-storage-class
  # Stores local Kind data inside the node container
  hostPath:
    path: /var/local/authify/user-postgres
    type: DirectoryOrCreate
  # keeps the PV around for manual cleanup if the PVC is deleted
  persistentVolumeReclaimPolicy: Retain
