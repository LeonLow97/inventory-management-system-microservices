apiVersion: batch/v1
kind: Job
metadata:
  name: user-schema-init
  namespace: authify
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 180
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-init
          image: postgres:14.2
          command: ["sh", "-ec"]
          args:
            - >-
              PGPASSWORD="$POSTGRES_PASSWORD" psql
              --host=user-headless-service
              --username="$POSTGRES_USER"
              --dbname="$POSTGRES_DB"
              --set=ON_ERROR_STOP=1
              --file=/schema/users.sql
          envFrom:
            - configMapRef:
                name: user-configmap
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: user-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: user-secret
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: user-schema
