version: '3.8' # Or another supported version
services:
  api-gateway:
    image: '<AWS_ACCOUNT_ID>.dkr.ecr.ap-southeast-1.amazonaws.com/authify:api-gateway-latest'
    ports:
      - '80:80'
    environment:
      MODE: production
    deploy:
      resources:
        limits:
          memory: 512M
    depends_on:
      - authify-service
    networks:
      - authify-network
  authify-service:
    image: '<AWS_ACCOUNT_ID>.dkr.ecr.ap-southeast-1.amazonaws.com/authify:authify-service-latest'
    ports:
      - '50051:50051'
    environment:
      MODE: production
      POSTGRES_USER: authentication_postgres
      POSTGRES_PASSWORD: CHANGE_ME
      POSTGRES_HOST: CHANGE_ME
      POSTGRES_PORT: 5432
      POSTGRES_DB: authify_users_db
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - authify-network
  consul:
    image: hashicorp/consul:1.15.4
    ports:
      - '8500:8500'
      - '8600:8600/udp'

networks:
  authify-network:
    driver: bridge
