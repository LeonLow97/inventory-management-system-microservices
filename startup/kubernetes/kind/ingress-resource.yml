apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: authify-ingress-resource
  namespace: authify
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway-clusterip
                port:
                  number: 80
